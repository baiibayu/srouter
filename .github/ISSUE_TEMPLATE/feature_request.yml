name: "✨ Feature Request"
description: Suggest an idea or enhancement for SRouter
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make SRouter even better? Tell us what you'd like to see!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've explored.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Gateway Core & Routing"
        - "Prompt Compression / Token Saver"
        - "Web Dashboard UI"
        - "Desktop App"
        - "CLI & Agent Generators"
        - "Documentation"
        - "Other"
